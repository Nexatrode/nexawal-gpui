name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  gpui-logic:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Run nexawal-gpui tests
        run: cargo test --locked --features ui-tests
      - name: Install pinned advisory checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency advisories
        run: bash scripts/check-advisories.sh
