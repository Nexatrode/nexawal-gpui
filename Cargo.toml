[package]
name = "nexawal-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "nexawal desktop app for macOS, Windows, and Linux (GPUI)"
repository = "https://github.com/nexatrode/nexawal-gpui"
publish = false
build = "build.rs"

[package.metadata.bundle]
name = "NexaWal"
identifier = "com.nexatrode.nexawal"
icon = ["assets/nexawal.icns", "assets/nexawal.png"]
category = "Finance"
short_description = "A native Monero wallet"
long_description = "NexaWal is a native Monero wallet for macOS, Windows, and Linux."
osx_minimum_system_version = "13.0"

[package.metadata.winresource]
FileDescription = "NexaWal Monero Wallet"
ProductName = "NexaWal"
OriginalFilename = "nexawal.exe"
LegalCopyright = "Copyright © Nexatrode"

[[bin]]
name = "nexawal"
path = "src/main.rs"

[dependencies]
# Pin matches a local Zed checkout that has the gpui_platform split
# (macOS Metal, Windows DirectX, Linux Wayland/X11).
# crates.io gpui 0.2.x is older and does not export gpui_platform.
gpui = { git = "https://github.com/zed-industries/zed", rev = "0ad5441b5370428eaa353a36f63c50c5448eead5" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "0ad5441b5370428eaa353a36f63c50c5448eead5", features = [
    "font-kit",
    "wayland",
    "x11",
    # Compile Metal shaders at runtime so macOS 26 does not require
    # `xcodebuild -downloadComponent MetalToolchain` just to `cargo run`.
    "runtime_shaders",
] }

walletcore = { git = "https://github.com/cacaosteve/MoneroWalletCoreFFI.git", rev = "4033bd04b0d9e2039f3a95e33db58b2218b64ffd" }
dirs = "5"
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico"] }
smallvec = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
rqrr = "0.8"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
unicode-segmentation = "1"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSImage",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSError",
    "NSString",
] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
    "std",
    "LAContext",
    "block2",
] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# keyring v3 has no native backends enabled by default. Secret Service is the
# persistent desktop store provided by GNOME Keyring and compatible KWallet
# integrations. The async implementation uses pure-Rust zbus instead of
# requiring libdbus development headers on end-user systems.
keyring = { version = "3", features = [
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }

# Wallet scanning crosses many small crypto and codec crates. Optimizing only
# the obvious WalletCore packages leaves generic helpers at opt-level 0 and
# makes plain `cargo run` roughly twice as slow as Catalyst/release. Keep
# incremental builds and light debug info, but optimize the complete runtime.
[profile.dev]
opt-level = 3
debug = 1
debug-assertions = false
overflow-checks = false
